[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babycue-server"
version = "0.2.0"
description = "BabyCue: Python server that relays video from an input phone to an output phone over the local network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Safe-sleep detection: MediaPipe + FiDIP (sleep position) and YOLO26 (crib hazards). The models are in models/.
ml = ["mediapipe>=0.10.14", "torch>=2.2", "ultralytics>=8.4", "yacs>=0.1.8"]

[project.scripts]
babycue-server = "babycue_server.__main__:main"

[tool.setuptools.packages.find]
include = ["babycue_server*"]

[tool.setuptools.package-data]
"babycue_server.detection.fidip" = ["*.yaml", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored FiDIP/HRNet code is kept as close to upstream as possible (see its NOTICE.md).
extend-exclude = [
    "babycue_server/detection/fidip/hrnet.py",
    "babycue_server/detection/fidip/transforms.py",
    "babycue_server/detection/fidip/inference.py",
    "babycue_server/detection/fidip/config.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N818"]
